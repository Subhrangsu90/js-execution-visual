<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23F7DF1E'/><path d='M19.5 24.5C20.5 24.5 21.8 24 22.3 23.2C22.6 22.7 22.7 22.1 22.7 20.8V14.5H20V20.5C20 21.2 19.8 21.6 19.3 21.6C18.8 21.6 18.5 21.2 18.5 20.5H16C16 22.7 17.3 24.5 19.5 24.5ZM11.6 24.5C13.8 24.5 15.1 23.3 15.1 21.4C15.1 19.7 14.1 18.8 12.3 18.1L11.5 17.8C10.5 17.4 10 17 10 16.3C10 15.6 10.6 15 11.6 15C12.5 15 13.1 15.4 13.4 16.2H15.8C15.5 14.2 14 13 11.6 13C9.4 13 8 14.3 8 16.4C8 18.2 9 19.1 10.7 19.8L11.5 20.1C12.7 20.6 13.1 21 13.1 21.7C13.1 22.5 12.3 23 11.4 23C10.2 23 9.6 22.4 9.3 21.2H6.9C7.2 23.3 8.9 24.5 11.6 24.5Z' fill='%23111111'/></svg>" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="JS Visualizer" />
  
  <!-- Inline Anti-FOUC Theme Script -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('js_vis_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) {}
    })();
  </script>

  <!-- Stylesheet (Render Blocking to Prevent FOUC) -->
  <link rel="stylesheet" href="/src/styles/index.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Structured Data / JSON-LD Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "JS Execution Visualizer",
    "alternateName": "JavaScript Engine & Runtime Debugger",
    "url": "https://js-execution-visual.vercel.app/",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "All",
    "description": "Interactive JavaScript execution visualizer and educational debugger. Step through JavaScript code execution with animated Call Stack, Stack & Heap Memory, Execution Contexts, Scope Chains, and Event Loop visualization.",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "featureList": [
      "Interactive Code Editor with CodeMirror 6",
      "Real-time Call Stack Visualization",
      "Stack & Heap Memory Model with Pointer Arrows",
      "Execution Context Creation & Execution Phases",
      "Scope Chain & Closure Inspection",
      "Event Loop, Microtasks & Callback Queue Simulation"
    ]
  }
  </script>
</head>
<body>
  <div id="app">
    <!-- ===== HEADER ===== -->
    <header id="header">
      <div class="header-left">
        <div class="logo">
          <span class="logo-icon" id="logo-icon"></span>
          <div class="logo-text-group">
            <h1 class="logo-title">JS Execution Visualizer</h1>
            <span class="logo-subtitle">JavaScript Engine Debugger</span>
          </div>
        </div>
        <div class="mode-selector-wrapper">
          <select id="mode-selector" class="mode-selector-select" title="Switch Application Mode" aria-label="Select Application Mode">
            <option value="sandbox" selected>🛠️ Sandbox Mode</option>
            <option value="quiz">🎯 Challenge / Quiz Mode</option>
            <option value="ast">🌳 AST / Bytecode Inspector</option>
            <option value="tour">🎓 Guided Tour & Lessons</option>
          </select>
        </div>
      </div>
      <div id="header-bubble-mount" class="header-center"></div>
      <div class="header-right">
        <div id="controls-bar"></div>
        <button id="btn-shortcuts" class="control-btn shortcuts-toggle-btn" title="Keyboard Shortcuts (?)" aria-label="Toggle Keyboard Shortcuts"></button>
        <button id="btn-theme-toggle" class="control-btn theme-toggle-btn" title="Toggle Light / Dark Theme" aria-label="Toggle Theme"></button>
      </div>
    </header>

    <!-- Step Progress Bar -->
    <div id="step-progress-container" class="step-progress-container">
      <div id="step-progress-fill" class="step-progress-fill"></div>
    </div>

    <!-- ===== MAIN AREA ===== -->
    <main id="main-area">
      <!-- Left: Code Editor -->
      <section id="editor-section" class="panel glass" aria-label="JavaScript Code Editor">
        <div class="panel-header">
          <h2 class="panel-title">
            <span class="panel-icon" id="icon-editor"></span>
            <span>Code Editor</span>
          </h2>
          <div class="panel-actions">
            <div class="preset-wrapper">
              <select id="preset-selector" class="preset-select" title="Load a JavaScript learning scenario / preset" aria-label="Select JavaScript Preset Example">
                <option value="" disabled selected>⚡ Examples & Presets...</option>
              </select>
            </div>
            <button id="btn-run" class="btn btn-primary" title="Run Code (Ctrl+Enter)" aria-label="Run Code">
              <span class="btn-icon" id="icon-run"></span>
              <span id="btn-run-text">Run</span>
            </button>
          </div>
        </div>
        <div id="editor-mount" class="panel-body"></div>
        <div id="step-description" class="step-description" aria-live="polite"></div>
      </section>

      <!-- Resizer between Editor and Viz -->
      <div class="resizer-gutter resizer-horizontal" id="gutter-editor-viz"></div>

      <!-- Right: Visualization Section -->
      <section id="viz-section" aria-label="Execution Visualizers">
        <!-- Row 1: Call Stack + Execution Context -->
        <div class="viz-row" id="viz-row-1">
          <!-- Call Stack -->
          <div id="callstack-panel" class="panel glass" aria-label="Call Stack Panel">
            <div class="panel-header">
              <h2 class="panel-title">
                <span class="panel-icon icon-stack" id="icon-stack"></span>
                <span>Call Stack</span>
              </h2>
              <span class="panel-counter" id="callstack-count">0 frames</span>
            </div>
            <div class="panel-body" id="callstack-body"></div>
          </div>

          <!-- Resizer between Stack and Context -->
          <div class="resizer-gutter resizer-horizontal" id="gutter-stack-ctx"></div>

          <!-- Execution Context -->
          <div id="execctx-panel" class="panel glass" aria-label="Execution Context Panel">
            <div class="panel-header">
              <h2 class="panel-title">
                <span class="panel-icon icon-ctx" id="icon-ctx"></span>
                <span>Execution Context</span>
              </h2>
              <span class="panel-counter" id="execctx-count">0 contexts</span>
            </div>
            <div class="panel-body" id="execctx-body"></div>
          </div>
        </div>

        <!-- Resizer between Row 1 and Row 2 -->
        <div class="resizer-gutter resizer-vertical" id="gutter-row1-row2"></div>

        <!-- Row 2: Memory Panel -->
        <div class="viz-row viz-row-single" id="viz-row-2">
          <div id="memory-panel" class="panel glass panel-wide" aria-label="Memory Panel (Stack and Heap)">
            <div class="panel-header">
              <h2 class="panel-title">
                <span class="panel-icon icon-mem" id="icon-mem"></span>
                <span>Memory</span>
              </h2>
              <div class="memory-legend" id="memory-legend">
                <span class="legend-item legend-number">Num</span>
                <span class="legend-item legend-string">Str</span>
                <span class="legend-item legend-boolean">Bool</span>
                <span class="legend-item legend-object">Obj</span>
                <span class="legend-item legend-array">Arr</span>
                <span class="legend-item legend-function">Fn</span>
              </div>
            </div>
            <div class="panel-body memory-body" id="memory-body">
              <div class="memory-stack" id="memory-stack">
                <div class="memory-section-label">Stack</div>
              </div>
              <div class="resizer-gutter resizer-horizontal" id="gutter-stack-heap"></div>
              <svg class="memory-arrows" id="memory-arrows"></svg>
              <div class="memory-heap" id="memory-heap">
                <div class="memory-section-label">Heap</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Resizer between Row 2 and Row 3 -->
        <div class="resizer-gutter resizer-vertical" id="gutter-row2-row3"></div>

        <!-- Row 3: Scope Chain + Event Loop -->
        <div class="viz-row" id="viz-row-3">
          <!-- Scope Chain -->
          <div id="scope-panel" class="panel glass" aria-label="Scope Chain Panel">
            <div class="panel-header">
              <h2 class="panel-title">
                <span class="panel-icon icon-scope" id="icon-scope"></span>
                <span>Scope Chain</span>
              </h2>
            </div>
            <div class="panel-body" id="scope-body"></div>
          </div>

          <!-- Resizer between Scope and Event Loop -->
          <div class="resizer-gutter resizer-horizontal" id="gutter-scope-loop"></div>

          <!-- Event Loop -->
          <div id="eventloop-panel" class="panel glass" aria-label="Event Loop Panel">
            <div class="panel-header">
              <h2 class="panel-title">
                <span class="panel-icon icon-loop" id="icon-loop"></span>
                <span>Event Loop</span>
              </h2>
            </div>
            <div class="panel-body eventloop-body" id="eventloop-body">
              <div class="el-section" id="el-webapis">
                <div class="el-section-label" id="label-webapis">Web APIs</div>
              </div>
              <div class="el-section" id="el-microtask">
                <div class="el-section-label" id="label-microtask">Microtask Queue</div>
              </div>
              <div class="el-section" id="el-macrotask">
                <div class="el-section-label" id="label-macrotask">Callback Queue</div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Resizer above Console -->
    <div class="resizer-gutter resizer-vertical" id="gutter-main-console"></div>

    <!-- ===== CONSOLE ===== -->
    <footer id="console-section" class="panel glass" aria-label="Console Output">
      <div class="panel-header">
        <h2 class="panel-title">
          <span class="panel-icon icon-console" id="icon-console"></span>
          <span>Console</span>
        </h2>
        <button id="btn-clear-console" class="btn btn-ghost btn-sm" title="Clear Console" aria-label="Clear Console Output"></button>
      </div>
      <div class="panel-body console-body" id="console-body"></div>
    <!-- ===== DEDICATED QUIZ PAGE CONTAINER ===== -->
    <main id="quiz-page-container" class="quiz-page-container hidden" aria-label="JavaScript Engine Quiz Page"></main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
